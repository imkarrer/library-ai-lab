# The starter Watchlist (ADR-0004). Format and matching: library_assistant/watchlist.py.
#
# This file is a STARTING POINT. Each Install's adults own their copy: a school counselor
# reviews it before any Student uses the Install (lib-sdo), adds the euphemisms, slang and
# misspellings Students at that school actually use, and keeps a dated record of which
# version is in use (escalation protocol, section 10). A miss is a Watchlist bug: report it
# to this public repo as a pattern only, never a Student's words.
#
# How to read it:
# - severity "high" means an adult must see it today, and the Student gets the Supportive
#   reply for the entry's category (ADR-0011) instead of an answer. High entries are written
#   in the first person or with clear intent, so report research ("books about suicide
#   prevention", "how did Hitler die", "To Kill a Mockingbird") does not raise them.
# - severity "low" raises a silent Flag for the end-of-day read. Low entries cast wider and
#   will catch some jokes and hyperbole; the adult reading the exchange decides.
# - Phrases match whole words after normalize(): case, accents, repeated letters ("kiiill")
#   and the digits/symbols 0 1 3 4 5 7 @ $ are folded already. Apostrophes become spaces,
#   so "don't" and "dont" are different phrases and both are listed.
# - must_match and must_not_match are checked every time the file loads: a near miss in
#   must_not_match is a promise that it does not fire.
version = "2026-10-29.1"

