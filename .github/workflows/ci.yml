name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flox
        uses: flox/install-flox-action@v2

      # Same command as the bead-loop gate, so a worktree that passes it is one CI passes.
      - name: Check
        uses: flox/activate-action@v2
        with:
          command: bash scripts/check.sh

  # The decks and handouts. On a Mac because their fonts are local (palette.css): a Linux
  # runner would set them in other fonts, and a page that fits here could spill there.
  materials:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Build and check
        run: flox activate -d docs/handout -- make -C docs/handout all check

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: materials
          path: docs/handout/build/

      # GITHUB_TOKEN's push starts no new run, so this can't loop.
      - name: Publish changed lessons
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          flox activate -d docs/handout -- make -C docs/handout publish
          git add library_assistant/static/materials
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish lesson materials"
          git pull --rebase origin main
          git push origin HEAD:main
