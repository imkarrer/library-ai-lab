{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.16.0",
    "install": {
      "nodejs": {
        "pkg-path": "nodejs"
      },
      "python": {
        "pkg-path": "python312"
      },
      "uv": {
        "pkg-path": "uv"
      }
    },
    "vars": {
      "UV_PYTHON_DOWNLOADS": "never"
    },
    "hook": {
      "on-activate": "  venv=\"$FLOX_ENV_CACHE/venv\"\n  if [ ! -d \"$venv\" ]; then\n    uv venv --quiet --python \"$(command -v python3)\" \"$venv\"\n  fi\n\n  stamp=\"$venv/.requirements.sha\"\n  want=\"$(cat \"$FLOX_ENV_PROJECT/requirements.txt\" \"$FLOX_ENV_PROJECT/requirements-dev.txt\" | sha256sum | cut -d' ' -f1)\"\n  if [ \"$(cat \"$stamp\" 2>/dev/null)\" != \"$want\" ]; then\n    echo \"Installing Python packages...\" >&2\n    VIRTUAL_ENV=\"$venv\" uv pip install --quiet \\\n      -r \"$FLOX_ENV_PROJECT/requirements.txt\" \\\n      -r \"$FLOX_ENV_PROJECT/requirements-dev.txt\" >&2 \\\n      && echo \"$want\" > \"$stamp\"\n  fi\n\n  # `flox activate -- cmd` runs no profile script, so put the venv on PATH\n  # here for it; interactive shells get the venv from [profile] below.\n  export PATH=\"$venv/bin:$PATH\"\n"
    },
    "profile": {
      "bash": "  source \"$FLOX_ENV_CACHE/venv/bin/activate\"\n",
      "zsh": "  source \"$FLOX_ENV_CACHE/venv/bin/activate\"\n",
      "fish": "  source \"$FLOX_ENV_CACHE/venv/bin/activate.fish\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "assistant": {
        "command": "  cd \"$FLOX_ENV_PROJECT\" && \"$FLOX_ENV_CACHE/venv/bin/uvicorn\" library_assistant.app:app --host 127.0.0.1 --port 8000\n"
      }
    }
  },
