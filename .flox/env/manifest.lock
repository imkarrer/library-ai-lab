{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.16.0",
    "install": {
      "llama-cpp": {
        "pkg-path": "llama-cpp",
        "systems": [
          "aarch64-darwin"
        ]
      },
      "nodejs": {
        "pkg-path": "nodejs"
      },
      "python": {
        "pkg-path": "python312"
      },
      "uv": {
        "pkg-path": "uv"
      }
    },
    "vars": {
      "UV_PYTHON_DOWNLOADS": "never"
    },
    "hook": {
      "on-activate": "  venv=\"$FLOX_ENV_CACHE/venv\"\n  if [ ! -d \"$venv\" ]; then\n    uv venv --quiet --python \"$(command -v python3)\" \"$venv\"\n  fi\n\n  stamp=\"$venv/.requirements.sha\"\n  want=\"$(cat \"$FLOX_ENV_PROJECT/requirements.txt\" \"$FLOX_ENV_PROJECT/requirements-dev.txt\" | sha256sum | cut -d' ' -f1)\"\n  if [ \"$(cat \"$stamp\" 2>/dev/null)\" != \"$want\" ]; then\n    echo \"Installing Python packages...\" >&2\n    VIRTUAL_ENV=\"$venv\" uv pip install --quiet \\\n      -r \"$FLOX_ENV_PROJECT/requirements.txt\" \\\n      -r \"$FLOX_ENV_PROJECT/requirements-dev.txt\" >&2 \\\n      && echo \"$want\" > \"$stamp\"\n  fi\n\n  # `flox activate -- cmd` runs no profile script, so put the venv on PATH\n  # here for it; interactive shells get the venv from [profile] below.\n  export PATH=\"$venv/bin:$PATH\"\n\n  # The demo model, once scripts/fetch_demo_model.sh has fetched it (ADR-0006's one online\n  # setup exception). `:-` keeps an override, so development keeps pointing at llm-box\n  # (ADR-0008) by exporting these two before activating.\n  export LIBRARY_ASSISTANT_OPENAI_ENDPOINT=\"${LIBRARY_ASSISTANT_OPENAI_ENDPOINT:-http://127.0.0.1:8080/v1}\"\n  export LIBRARY_ASSISTANT_OPENAI_MODEL=\"${LIBRARY_ASSISTANT_OPENAI_MODEL:-Qwen3-30B-A3B-Instruct-2507}\"\n"
    },
    "profile": {
      "bash": "  source \"$FLOX_ENV_CACHE/venv/bin/activate\"\n",
      "zsh": "  source \"$FLOX_ENV_CACHE/venv/bin/activate\"\n",
      "fish": "  source \"$FLOX_ENV_CACHE/venv/bin/activate.fish\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "assistant": {
        "command": "  # library_assistant/__main__.py runs uvicorn with no access log (it writes the raw path\n  # and query, which could carry a Token or Card number; ADR-0003 addendum) and a bounded\n  # shutdown, and reads LIBRARY_ASSISTANT_HOST / _PORT.\n  cd \"$FLOX_ENV_PROJECT\" && exec \"$FLOX_ENV_CACHE/venv/bin/python\" -m library_assistant\n"
      },
      "model": {
        "command": "  model=\"$FLOX_ENV_CACHE/models/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf\"\n  if [ ! -f \"$model\" ]; then\n    echo \"Demo model not found; run scripts/fetch_demo_model.sh once, online, first.\" >&2\n    exit 1\n  fi\n  # No -v, --log-prompts-dir, or --slot-save-path, and --no-slots (ADR-0003 addendum): the\n  # model server keeps no log or cache of a question. 127.0.0.1 only (ADR-0006).\n  # --n-gpu-layers 0 (lib-30v): on the M5 Pro, llama.cpp's Metal backend fails every request\n  # with an out-of-memory error whatever is offloaded; the CPU answers at ~12 tokens/s.\n  exec llama-server \\\n    --model \"$model\" \\\n    --host 127.0.0.1 \\\n    --port 8080 \\\n    --ctx-size 8192 \\\n    --n-gpu-layers 0 \\\n    --no-slots\n",
        "systems": [
          "aarch64-darwin"
        ]
      }
    }
  },
