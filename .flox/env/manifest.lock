    "hook": {
      "on-activate": "  # pymarc until the catalog has it: built once from .flox/pkgs/pymarc, then on the path.\n  if [ ! -e \"$FLOX_ENV_PROJECT/result-pymarc\" ]; then\n    echo \"Building pymarc (once)...\" >&2\n    (cd \"$FLOX_ENV_PROJECT\" && flox build pymarc >&2)\n  fi\n  export PYTHONPATH=\"$FLOX_ENV_PROJECT/result-pymarc/lib/python3.13/site-packages${PYTHONPATH:+:$PYTHONPATH}\"\n\n  # The demo model, once scripts/fetch_demo_model.sh has fetched it (ADR-0006's one online\n  # setup exception). `:-` keeps an override, so development keeps pointing at llm-box\n  # (ADR-0008) by exporting these two before activating.\n  export LIBRARY_ASSISTANT_OPENAI_ENDPOINT=\"${LIBRARY_ASSISTANT_OPENAI_ENDPOINT:-http://127.0.0.1:8080/v1}\"\n  export LIBRARY_ASSISTANT_OPENAI_MODEL=\"${LIBRARY_ASSISTANT_OPENAI_MODEL:-Qwen3-30B-A3B-Instruct-2507}\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "assistant": {
        "command": "  # library_assistant/__main__.py runs uvicorn with no access log (it writes the raw path\n  # and query, which could carry a Token or Card number; ADR-0003 addendum) and a bounded\n  # shutdown, and reads LIBRARY_ASSISTANT_HOST / _PORT.\n  cd \"$FLOX_ENV_PROJECT\" && exec python3 -m library_assistant\n"
      },
      "model": {
        "command": "  model=\"$FLOX_ENV_CACHE/models/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf\"\n  if [ ! -f \"$model\" ]; then\n    echo \"Demo model not found; run scripts/fetch_demo_model.sh once, online, first.\" >&2\n    exit 1\n  fi\n  # No -v, --log-prompts-dir, or --slot-save-path, and --no-slots (ADR-0003 addendum): the\n  # model server keeps no log or cache of a question. 127.0.0.1 only (ADR-0006).\n  # Metal again (lib-30v): llama.cpp 0.6.0 failed every request on the M5 Pro with a Metal\n  # out-of-memory error; 0.7.0 fits all 49 layers on the GPU (~25-32 tokens/s, against ~12\n  # on the CPU), with under 1 GiB of the GPU's working set to spare: nothing else can be\n  # loaded beside it. ./stack runs Ollama instead.\n  exec llama-server \\\n    --model \"$model\" \\\n    --host 127.0.0.1 \\\n    --port 8080 \\\n    --ctx-size 8192 \\\n    --no-slots\n",
        "systems": [
          "aarch64-darwin"
        ]
      }
    },
    "build": {
      "library-assistant": {
        "command": "  lib=\"$out/lib/library-assistant\"\n  mkdir -p \"$lib\" \"$out/bin\"\n  cp -R library_assistant \"$lib/\"\n  find \"$lib\" -name __pycache__ -prune -exec rm -rf {} +\n  # minting_page.py reads it from beside the package.\n  cp offline-minting.html \"$lib/\"\n  # Flox wraps this script with a PYTHONPATH of the runtime packages; the app and pymarc\n  # are added here, from the store.\n  cat > \"$out/bin/library-assistant\" <<LAUNCHER\n#!/usr/bin/env python3\nimport runpy, sys\nsys.path[:0] = [\"$lib\", \"${pymarc}/lib/python3.13/site-packages\"]\nrunpy.run_module(\"library_assistant\", run_name=\"__main__\", alter_sys=True)\nLAUNCHER\n  chmod +x \"$out/bin/library-assistant\"\n",
        "runtime-packages": [
          "python3",
          "fastapi",
          "uvicorn",
          "httpx",
          "qrcode",
          "python-multipart",
          "cryptography"
        ],
        "version": "0.1.0",
        "description": "The Library Assistant: a local AI assistant for a school library"
      }
    }
  },
