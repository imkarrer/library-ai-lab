schema-version = "1.16.0"

[install]
# The app's Python libraries come from the catalog, in this lock, not from PyPI: what the
# tests run on is what [build.library-assistant] ships. pymarc isn't in the catalog yet:
# .flox/pkgs/pymarc builds it until it is.
python3.pkg-path = "python313"
fastapi.pkg-path = "python313Packages.fastapi"
uvicorn.pkg-path = "python313Packages.uvicorn"
httpx.pkg-path = "python313Packages.httpx"
qrcode.pkg-path = "python313Packages.qrcode"
python-multipart.pkg-path = "python313Packages.python-multipart"
cryptography.pkg-path = "python313Packages.cryptography"
# Development only: left out of the package by runtime-packages below.
pytest.pkg-path = "python313Packages.pytest"
ruff.pkg-path = "ruff"
nodejs.pkg-path = "nodejs"

[install.llama-cpp]
pkg-path = "llama-cpp"
# Own group: the model servers upgrade on their own (`flox upgrade models`), not with
# Python and its libraries.
pkg-group = "models"
# Only the M5 Pro demo runs the model server; dev boxes point LIBRARY_ASSISTANT_OPENAI_*
# at llm-box instead (ADR-0008).
systems = ["aarch64-darwin"]

[install.ollama]
pkg-path = "ollama"
pkg-group = "models"
# Metal on Apple Silicon: both demo Lanes (./stack up) run on it, at the same speed as
# Ollama.app. Linux dev boxes use llm-box (ADR-0008).
systems = ["aarch64-darwin"]

[hook]
on-activate = '''
  # pymarc until the catalog has it: built once from .flox/pkgs/pymarc, then on the path.
  if [ ! -e "$FLOX_ENV_PROJECT/result-pymarc" ]; then
    echo "Building pymarc (once)..." >&2
    (cd "$FLOX_ENV_PROJECT" && flox build pymarc >&2)
  fi
  export PYTHONPATH="$FLOX_ENV_PROJECT/result-pymarc/lib/python3.13/site-packages${PYTHONPATH:+:$PYTHONPATH}"

  # The demo model, once scripts/fetch_demo_model.sh has fetched it (ADR-0006's one online
  # setup exception). `:-` keeps an override, so development keeps pointing at llm-box
  # (ADR-0008) by exporting these two before activating.
  export LIBRARY_ASSISTANT_OPENAI_ENDPOINT="${LIBRARY_ASSISTANT_OPENAI_ENDPOINT:-http://127.0.0.1:8080/v1}"
  export LIBRARY_ASSISTANT_OPENAI_MODEL="${LIBRARY_ASSISTANT_OPENAI_MODEL:-Qwen3-30B-A3B-Instruct-2507}"
'''

[build.library-assistant]
description = "The Library Assistant: a local AI assistant for a school library"
version = "0.1.0"
# Only the app's own libraries ship; pytest, ruff, nodejs and the model servers don't.
runtime-packages = ["python3", "fastapi", "uvicorn", "httpx", "qrcode", "python-multipart", "cryptography"]
command = '''
  lib="$out/lib/library-assistant"
  mkdir -p "$lib" "$out/bin"
  cp -R library_assistant "$lib/"
  find "$lib" -name __pycache__ -prune -exec rm -rf {} +
  # minting_page.py reads it from beside the package.
  cp offline-minting.html "$lib/"
  # Flox wraps this script with a PYTHONPATH of the runtime packages; the app and pymarc
  # are added here, from the store.
  cat > "$out/bin/library-assistant" <<LAUNCHER
#!/usr/bin/env python3
import runpy, sys
sys.path[:0] = ["$lib", "${pymarc}/lib/python3.13/site-packages"]
runpy.run_module("library_assistant", run_name="__main__", alter_sys=True)
LAUNCHER
  chmod +x "$out/bin/library-assistant"
'''

[services.assistant]
command = '''
  # library_assistant/__main__.py runs uvicorn with no access log (it writes the raw path
  # and query, which could carry a Token or Card number; ADR-0003 addendum) and a bounded
  # shutdown, and reads LIBRARY_ASSISTANT_HOST / _PORT.
  cd "$FLOX_ENV_PROJECT" && exec python3 -m library_assistant
'''

[services.model]
command = '''
  model="$FLOX_ENV_CACHE/models/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf"
  if [ ! -f "$model" ]; then
    echo "Demo model not found; run scripts/fetch_demo_model.sh once, online, first." >&2
    exit 1
  fi
  # No -v, --log-prompts-dir, or --slot-save-path, and --no-slots (ADR-0003 addendum): the
  # model server keeps no log or cache of a question. 127.0.0.1 only (ADR-0006).
  # Metal again (lib-30v): llama.cpp 0.6.0 failed every request on the M5 Pro with a Metal
  # out-of-memory error; 0.7.0 fits all 49 layers on the GPU (~25-32 tokens/s, against ~12
  # on the CPU), with under 1 GiB of the GPU's working set to spare: nothing else can be
  # loaded beside it. ./stack runs Ollama instead.
  exec llama-server \
    --model "$model" \
    --host 127.0.0.1 \
    --port 8080 \
    --ctx-size 8192 \
    --no-slots
'''
systems = ["aarch64-darwin"]

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
