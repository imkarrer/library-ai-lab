schema-version = "1.16.0"

[install]
python.pkg-path = "python312"
uv.pkg-path = "uv"
nodejs.pkg-path = "nodejs"

[install.llama-cpp]
pkg-path = "llama-cpp"
# Only the M5 Pro demo runs the model server; dev boxes point LIBRARY_ASSISTANT_OPENAI_*
# at llm-box instead (ADR-0008).
systems = ["aarch64-darwin"]

[vars]
UV_PYTHON_DOWNLOADS = "never"

[hook]
on-activate = '''
  venv="$FLOX_ENV_CACHE/venv"
  if [ ! -d "$venv" ]; then
    uv venv --quiet --python "$(command -v python3)" "$venv"
  fi

  stamp="$venv/.requirements.sha"
  want="$(cat "$FLOX_ENV_PROJECT/requirements.txt" "$FLOX_ENV_PROJECT/requirements-dev.txt" | sha256sum | cut -d' ' -f1)"
  if [ "$(cat "$stamp" 2>/dev/null)" != "$want" ]; then
    echo "Installing Python packages..." >&2
    VIRTUAL_ENV="$venv" uv pip install --quiet \
      -r "$FLOX_ENV_PROJECT/requirements.txt" \
      -r "$FLOX_ENV_PROJECT/requirements-dev.txt" >&2 \
      && echo "$want" > "$stamp"
  fi

  # `flox activate -- cmd` runs no profile script, so put the venv on PATH
  # here for it; interactive shells get the venv from [profile] below.
  export PATH="$venv/bin:$PATH"

  # The demo model, once scripts/fetch_demo_model.sh has fetched it (ADR-0006's one online
  # setup exception). `:-` keeps an override, so development keeps pointing at llm-box
  # (ADR-0008) by exporting these two before activating.
  export LIBRARY_ASSISTANT_OPENAI_ENDPOINT="${LIBRARY_ASSISTANT_OPENAI_ENDPOINT:-http://127.0.0.1:8080/v1}"
  export LIBRARY_ASSISTANT_OPENAI_MODEL="${LIBRARY_ASSISTANT_OPENAI_MODEL:-Qwen3-30B-A3B-Instruct-2507}"
'''

[profile]
bash = '''
  source "$FLOX_ENV_CACHE/venv/bin/activate"
'''
zsh = '''
  source "$FLOX_ENV_CACHE/venv/bin/activate"
'''
fish = '''
  source "$FLOX_ENV_CACHE/venv/bin/activate.fish"
'''

[services.assistant]
command = '''
  # library_assistant/__main__.py runs uvicorn with no access log (it writes the raw path
  # and query, which could carry a Token or Card number; ADR-0003 addendum) and a bounded
  # shutdown, and reads LIBRARY_ASSISTANT_HOST / _PORT.
  cd "$FLOX_ENV_PROJECT" && exec "$FLOX_ENV_CACHE/venv/bin/python" -m library_assistant
'''

[services.model]
command = '''
  model="$FLOX_ENV_CACHE/models/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf"
  if [ ! -f "$model" ]; then
    echo "Demo model not found; run scripts/fetch_demo_model.sh once, online, first." >&2
    exit 1
  fi
  # No -v, --log-prompts-dir, or --slot-save-path, and --no-slots (ADR-0003 addendum): the
  # model server keeps no log or cache of a question. 127.0.0.1 only (ADR-0006).
  # --n-gpu-layers 0 (lib-30v): on the M5 Pro, llama.cpp's Metal backend fails every request
  # with an out-of-memory error whatever is offloaded; the CPU answers at ~12 tokens/s.
  exec llama-server \
    --model "$model" \
    --host 127.0.0.1 \
    --port 8080 \
    --ctx-size 8192 \
    --n-gpu-layers 0 \
    --no-slots
'''
systems = ["aarch64-darwin"]

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
