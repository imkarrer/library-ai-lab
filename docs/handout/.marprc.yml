# Marp settings for the handout and the demo deck (see README.md). Source lines wrap at 92
# columns like the rest of the repo's Markdown, so a newline must not become a line break on
# the page.
html: true
# The palette and the shared look (headings, tables, callouts, chips) are the assistant's own
# (library_assistant/static/palette.css and components.css), so the handout and the app's
# pages change together.
themeSet:
  - ../../library_assistant/static/palette.css
  - ../../library_assistant/static/components.css
  - ./handout.css
  - ./deck.css
options:
  markdown:
    breaks: false
allowLocalFiles: true
